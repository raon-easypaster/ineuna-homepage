<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>INEUNA 관리자</title>
<style>
:root{--bg:#faf8f4;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#2f4a3a;--accent2:#b5833a;--card:#fff;--err:#a8322d}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit}
header{border-bottom:1px solid var(--line);background:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 16px}
.logo{font-weight:800;letter-spacing:.18em;font-size:18px;color:var(--accent);text-decoration:none}
.logo small{letter-spacing:.04em;font-weight:600;color:var(--mute);font-size:12px;margin-left:8px}
main{flex:1;display:flex;align-items:center;padding:40px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:100%;max-width:400px;margin:0 auto}
h1{font-size:22px;margin-bottom:6px}
.sub{color:var(--mute);font-size:14px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;border:0;cursor:pointer}
.btn.full{width:100%;margin-top:24px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-size:14px;color:var(--err);min-height:1.4em}
.dash{width:100%}
.dash h1{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.tile h2{font-size:16px;margin-bottom:6px}
.tile p{color:var(--mute);font-size:14px}
.tile .soon{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:#f6ead6;color:#8a5f1c}
[hidden]{display:none!important}
@media (max-width:480px){.card{padding:26px 20px;border-radius:14px}main{align-items:flex-start;padding:24px 0}}
</style>
</head>
<body>
<header><div class="wrap">
 <a class="logo" href="../">INEUNA<small>관리자</small></a>
 <button class="btn ghost" id="logout" hidden>로그아웃</button>
</div></header>

<main><div class="wrap">
 <form class="card" id="loginForm" hidden novalidate>
  <h1>관리자 로그인</h1>
  <p class="sub">홈페이지 관리자만 접근할 수 있습니다.</p>
  <label for="username">아이디</label>
  <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64">
  <label for="password">비밀번호</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
  <button class="btn full" type="submit">로그인</button>
  <p class="msg" id="msg" role="alert"></p>
 </form>

 <section class="dash" id="dash" hidden>
  <h1><span id="who"></span>님, 환영합니다</h1>
  <p class="sub">관리 기능은 단계적으로 추가됩니다.</p>
  <div class="grid">
   <div class="tile"><h2>홈페이지 바로가기</h2><p><a href="../">공개 홈페이지 열기 →</a></p></div>
   <div class="tile"><h2>문의 내역</h2><p>문의 폼 수신 내역 확인</p><span class="soon">준비 중</span></div>
   <div class="tile"><h2>콘텐츠 관리</h2><p>사업 소개·사진 수정</p><span class="soon">준비 중</span></div>
  </div>
 </section>
</div></main>

<script>
const $ = (id) => document.getElementById(id);
const form = $('loginForm'), msg = $('msg');

function show(user) {
  form.hidden = !!user;
  $('dash').hidden = !user;
  $('logout').hidden = !user;
  if (user) $('who').textContent = user;
  else $('username').focus();
}

fetch('/api/me', { credentials: 'same-origin' })
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => show(d && d.username))
  .catch(() => show(null));

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  const username = $('username').value.trim(), password = $('password').value;
  if (!username || !password) { msg.textContent = '아이디와 비밀번호를 입력하세요.'; return; }
  const btn = form.querySelector('button');
  btn.disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || '로그인에 실패했습니다.');
    $('password').value = '';
    show(d.username);
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

$('logout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
  show(null);
});
</script>
</body>
</html>
